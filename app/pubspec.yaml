name: football_gm_app
description: Football GM — complex fantasy football client (Flutter).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  sqflite: ^2.4.3
  path: ^1.9.1
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  json_annotation: ^4.12.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
